apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aeroinbox-ingress
  namespace: aeroinbox
  annotations:
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
spec:
  ingressClassName: azure-application-gateway
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service-svc
            port:
              number: 8000
