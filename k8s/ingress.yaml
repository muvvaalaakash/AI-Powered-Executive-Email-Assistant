apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aeroinbox-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "azure/application-gateway"
    appgw.ingress.kubernetes.io/ssl-redirect: "false" # In production, set to true with App Gateway SSL certificates configured
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8000
